# /etc/pcrlock-toolkit/platsec.conf - configuration for platsec-pcr-check.
#
# Precedence: command line > PLATSEC_* environment variables > this file > defaults.
# Format: KEY=VALUE, one per line; '#' starts a comment. This file is parsed,
# never sourced as a shell script.
#
# The initrd uses a copy of this file: rebuild the initrd/UKI after changing it,
# and regenerate the pcrlock component with `pcrlock generate platsec`
# (platsec-pcr-check --status reads this file too).

# PCR to measure the baseline into.
#PCR=15

# Checks to run, space- or comma-separated: memenc, iommu, preboot_dma.
#CHECKS="memenc iommu preboot_dma"

# 1: power off if the baseline isn't met. 0: only measure.
#ENFORCE=1
