# /etc/pcrlock-toolkit/pcrlock.conf - global settings for pcrlock(1).
# Format: Key=Value, one per line; '#' starts a comment at the start of a line.
# Components themselves are configured in components.d/<priority>-<name>.conf;
# examples are in /usr/share/pcrlock-toolkit/examples/components.d/.

# Where generated .pcrlock files go.
#Directory=/etc/pcrlock.d

# How to update the policy after something changed:
#   now   restart systemd-pcrlock-make-policy.service right away
#   mark  only mark it for restart (pacman's restart-marked hook picks it up)
#   none  leave it to you
# Options for make-policy itself (e.g. --location=, --pcr=) belong in a
# drop-in for systemd-pcrlock-make-policy.service, so they apply everywhere.
#Policy=now

# Component (without .pcrlock.d) that kernel-install's UKI variants go into.
# Variants are named <kernel version>.pcrlock.
#UkiComponent=650-uki
