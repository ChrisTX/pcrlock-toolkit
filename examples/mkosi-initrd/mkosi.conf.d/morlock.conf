# /etc/mkosi-initrd/mkosi.conf.d/morlock.conf
# mkosi-initrd counterpart of the dracut module morlock: set and lock MOR and
# measure its state into PCR 15 before any disk is unlocked.
#
# The tree under /usr/lib/pcrlock-toolkit/mkosi-initrd/morlock only holds the
# initrd.target.wants symlink (mkosi-initrd presets every unit to disabled).

[Content]
Packages=
        coreutils               # od
        e2fsprogs               # chattr (efivarfs variables are immutable)

ExtraTrees=
        /usr/lib/pcrlock-toolkit/mkosi-initrd/morlock:/
        /usr/bin/mor-lock:/usr/bin/mor-lock
        /usr/lib/systemd/system/mor-lock.service:/usr/lib/systemd/system/mor-lock.service
        # Host customisations of the unit, if you have any. Every listed path
        # must exist, or the build fails.
        #/etc/systemd/system/mor-lock.service.d:/etc/systemd/system/mor-lock.service.d
