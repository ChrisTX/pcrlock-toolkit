# /etc/mkosi-initrd/mkosi.conf.d/platsec.conf
# mkosi-initrd counterpart of the dracut module platsec: check and measure the
# memory protection baseline before any disk is unlocked.
#
# mkosi-initrd installs packages from the repositories rather than copying
# host files, so the toolkit's files are copied in with ExtraTrees=. The tree
# under /usr/lib/pcrlock-toolkit/mkosi-initrd/platsec only holds the
# initrd.target.wants symlink (mkosi-initrd presets every unit to disabled).

[Content]
Packages=
        coreutils               # cat, dd, od, sleep, tr
        grep
        kmod                    # modprobe ccp / msr

KernelModules=
        ccp                     # AMD TSME status
        msr                     # Intel IA32_TME_ACTIVATE (built in on some kernels)

ExtraTrees=
        /usr/lib/pcrlock-toolkit/mkosi-initrd/platsec:/
        /usr/bin/platsec-pcr-check:/usr/bin/platsec-pcr-check
        /usr/lib/systemd/system/platsec-pcr-check.service:/usr/lib/systemd/system/platsec-pcr-check.service
        # The policy the pcrlock component was generated from; always included.
        /etc/pcrlock-toolkit/platsec.conf:/etc/pcrlock-toolkit/platsec.conf
        # Host customisations of the unit, if you have any. Every listed path
        # must exist, or the build fails.
        #/etc/systemd/system/platsec-pcr-check.service.d:/etc/systemd/system/platsec-pcr-check.service.d
