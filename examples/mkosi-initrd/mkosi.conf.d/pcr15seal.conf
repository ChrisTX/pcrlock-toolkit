# /etc/mkosi-initrd/mkosi.conf.d/pcr15seal.conf
# mkosi-initrd counterpart of the dracut module pcr15seal: seal the initrd
# phase by extending "initrd-sealed" into PCR 15 via io.systemd.PCRExtend.
#
# varlinkctl, systemd-pcrextend and systemd-pcrextend.socket (statically
# enabled in sockets.target.wants) come with mkosi-initrd's systemd and
# tpm2-tss packages. The tree under /usr/lib/pcrlock-toolkit/mkosi-initrd/pcr15seal
# only holds the initrd.target.wants symlink (mkosi-initrd presets every unit
# to disabled).

[Content]
ExtraTrees=
        /usr/lib/pcrlock-toolkit/mkosi-initrd/pcr15seal:/
        /usr/lib/systemd/system/initrd-pcr15-seal.service:/usr/lib/systemd/system/initrd-pcr15-seal.service
        # Host customisations of the unit, if you have any. Every listed path
        # must exist, or the build fails.
        #/etc/systemd/system/initrd-pcr15-seal.service.d:/etc/systemd/system/initrd-pcr15-seal.service.d
