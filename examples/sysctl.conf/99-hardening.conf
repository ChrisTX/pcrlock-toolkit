# Named 99-* so it sorts after systemd's 50-default.conf and 50-coredump.conf,
# which would otherwise reset several of these values.
# Kernel/vm/dev settings not listed here are set on the kernel cmdline.

# Overridden by systemd's 50-default.conf when sorted before it
fs.protected_fifos=2
fs.protected_hardlinks=1
fs.protected_regular=2
fs.protected_symlinks=1
kernel.sysrq=0

# fs.suid_dumpable is intentionally left to systemd's 50-coredump.conf (2):
# privileged crashes are piped to systemd-coredump and stored root-only.

net.core.bpf_jit_harden=2

# io_uring: only CAP_SYS_ADMIN and members of the io_uring group
# GID pinned in /etc/sysusers.d/io_uring.conf - keep both in sync
kernel.io_uring_disabled=1
kernel.io_uring_group=900
