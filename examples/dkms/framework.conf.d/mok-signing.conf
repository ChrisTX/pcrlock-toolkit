# /etc/dkms/framework.conf.d/mok-signing.conf
# Sign DKMS modules with a TPM2-held MOK via sign-file-tpm2 (needs tpm2-openssl).
# Example: copy to /etc/dkms/framework.conf.d/ to enable it. mok_signing_key
# is a TSS2 PEM key file; adjust both paths to your MOK.
sign_file="/usr/lib/pcrlock-toolkit/sign-file-tpm2"
mok_signing_key="/etc/secureboot/keys/MOK/MOK.pem"
mok_certificate="/etc/secureboot/keys/MOK/MOK.crt"
