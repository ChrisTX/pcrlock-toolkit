# Secure Boot authorities in PCR 7 after the separator: the db entries that
# verified the boot loaders, and with shim its SbatLevel. Same name as
# systemd's generated component, which must go: remove
# /var/lib/pcrlock.d/620-secureboot-authority.pcrlock.d and disable
# systemd-pcrlock-secureboot-authority.service.
#
# Path= is the shim binary that will boot next (the unsigned package file has
# the same .sbatlevel section). If it will raise SbatLevel, the SbatLevel
# record is replaced with the predicted one and the variant of the current
# boot is kept as secureboot-authority-previous. Leave Path= out without shim.
Type=secureboot-authority
Path=/usr/share/shim/shimx64.efi
