# Replace the "absent" ExitBootServices variant (no PCR 5 records) with a copy
# of the "present" one, so PCR 5 only accepts boots where the firmware logged
# both EV_EFI_ACTION events. Leaving them out is a firmware bug, not a
# configuration that needs to be allowed.
Type=copy
Source=/usr/lib/pcrlock.d/700-action-efi-exit-boot-services.pcrlock.d/300-present.pcrlock
Output=700-action-efi-exit-boot-services.pcrlock.d/600-absent.pcrlock
