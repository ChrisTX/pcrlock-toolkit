# Secure Boot policy in PCR 7 (SecureBoot, PK, KEK, db, dbx), from the current
# EFI variables. Same name as systemd's generated component, which must go:
# remove /var/lib/pcrlock.d/240-secureboot-policy.pcrlock.d and disable
# systemd-pcrlock-secureboot-policy.service.
#
# After a dbx update the variant of the current boot is kept as
# secureboot-policy-previous until `pcrlock prune`. Changes to PK, KEK or db
# are refused until a boot has measured them. Enable
# pcrlock-secureboot-policy.path to regenerate this when dbx changes.
Type=secureboot-policy
